<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:" />
  <title>雨衣ちゃんのデバッグルーム</title>
  <style>
    :root {
      --bg: #1e1f26;
      --panel: #262832;
      --panel2: #2e313d;
      --line: #3a3d4a;
      --fg: #e6e6ee;
      --muted: #9aa0b0;
      --accent: #4e5bb5;
      --ok: #4caf7d;
      --err: #e06b7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', system-ui, sans-serif;
      font-size: 13px;
    }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

    /* tabs: Cue (agent-facing) and the three kinds of fixed lines */
    #tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    .tab {
      padding: 6px 14px; border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0;
      background: var(--panel2); color: var(--muted); cursor: pointer; font: inherit;
    }
    .tab:hover { color: var(--fg); }
    .tab.active { background: var(--bg); color: var(--fg); border-color: var(--accent); }

    #main { display: grid; grid-template-columns: 260px 1fr 300px; min-height: 0; }
    #main > * { min-height: 0; }
    .col { overflow: auto; padding: 10px; }
    /* Left column: the list and the layer tree each scroll on their own so the
       tree (the pose/expression selector) is always reachable no matter how
       long the list gets. The tree is shared by every tab. */
    #left { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
    .left-pane { overflow: auto; padding: 10px; }
    #list-pane { flex: 0 0 auto; max-height: 45%; border-bottom: 1px solid var(--line); }
    #tree-pane { flex: 1 1 auto; }
    #center {
      display: flex; flex-direction: column;
      background: repeating-conic-gradient(#24252c 0% 25%, #1b1c22 0% 50%) 50% / 24px 24px;
    }
    #right { border-left: 1px solid var(--line); background: var(--panel); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 0 8px; }
    #preview-wrap { flex: 1; position: relative; min-width: 0; min-height: 0; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* lists */
    .item-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
    .cue-group {
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      margin: 10px 0 3px; padding-bottom: 2px; border-bottom: 1px solid var(--line);
    }
    .cue-group small { display: block; text-transform: none; letter-spacing: 0; font-size: 10px; }
    .cue-item {
      display: flex; flex-direction: column; text-align: left; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--panel2);
      color: var(--fg); cursor: pointer; font: inherit;
    }
    .cue-item:hover { border-color: var(--accent); }
    .cue-item.active { border-color: var(--accent); background: #34385a; }
    .cue-item.internal { color: var(--muted); font-style: italic; }
    .cue-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cue-id { font-size: 10px; color: var(--muted); font-family: monospace; }
    .filter { color: var(--muted); margin: 6px 0 12px; display: flex; align-items: center; gap: 5px; }

    /* tree */
    .tree-group { margin-left: 12px; }
    .tree-node { line-height: 1.7; white-space: nowrap; }
    .tree-node > label { cursor: pointer; }
    details > summary { cursor: pointer; color: var(--muted); }
    details > summary:hover { color: var(--fg); }

    /* steps strip (sequence tabs) */
    #steps-strip { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line); padding: 8px; }
    #steps-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .step-card {
      flex: 0 0 150px; display: flex; flex-direction: column; gap: 2px; text-align: left;
      padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel2); color: var(--fg); cursor: pointer; font: inherit;
    }
    .step-card:hover { border-color: var(--accent); }
    .step-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .step-card.playing { background: #3a3f63; }
    .step-no { font-size: 11px; color: var(--muted); }
    .step-text { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .strip-actions { display: flex; gap: 6px; margin-top: 6px; }

    /* form */
    .field { margin-bottom: 10px; }
    .field > label { display: block; color: var(--muted); margin-bottom: 3px; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 5px 7px; background: var(--panel2); border: 1px solid var(--line);
      border-radius: 6px; color: var(--fg); font: inherit;
    }
    input:read-only, select:disabled { color: var(--muted); }
    textarea { font-family: monospace; font-size: 12px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
    .check { display: flex; align-items: center; gap: 6px; }
    .slider-row { display: grid; grid-template-columns: 90px 1fr 42px; align-items: center; gap: 6px; margin-bottom: 4px; }
    .slider-row label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .slider-row input[type=range] { width: 100%; }
    .slider-val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    /* delivery panel: ticked = this line overrides; ◆ = the derived value */
    .dl-row { display: grid; grid-template-columns: 16px 62px 1fr 38px; align-items: center; gap: 5px; }
    .dl-row label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .dl-track { position: relative; }
    .dl-track input[type=range] { width: 100%; }
    .dl-mark { position: absolute; top: -8px; transform: translateX(-50%); font-size: 9px; color: #8f9bff; pointer-events: none; }
    .dl-row.auto input[type=range] { opacity: .4; }
    .dl-val { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
    .dl-row.auto .dl-val { color: var(--muted); }
    .dl-hint { grid-column: 2 / -1; font-size: 10px; color: var(--muted); min-height: 2px; margin-bottom: 3px; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .row { display: flex; gap: 6px; }
    button.action {
      flex: 1; padding: 7px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel2); color: var(--fg); cursor: pointer; font: inherit;
    }
    button.action:hover { border-color: var(--accent); }
    button.action:disabled { opacity: .4; cursor: not-allowed; }
    #save, #seq-save { background: var(--accent); border-color: var(--accent); }
    #seq-save.dirty { box-shadow: 0 0 0 2px #fff3 inset; }
    hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
    #status { min-height: 18px; margin-top: 8px; font-size: 12px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }

    /* ACC lane: each mora high or low, as the engine will read the line */
    #acc-lane { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    .acc-head { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .acc-head button.action { flex: 0 0 auto; margin-left: auto; padding: 3px 10px; }
    /* 高さは固定。中身（セリフの長さ・解析中かどうか）で高さが変わると、上の
       プレビューの枠が伸び縮みして、ボタンを押すたびにキャラクターがガタつく。 */
    #acc-words { display: flex; flex-wrap: nowrap; gap: 2px; align-items: flex-end; height: 66px; overflow-x: auto; overflow-y: hidden; transition: opacity .15s; }
    #acc-words.busy { opacity: .45; }
    .acc-word { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding: 2px 3px; border: 1px solid transparent; border-radius: 5px; }
    .acc-word.head { margin-left: 10px; }
    .acc-word.overridden { border-color: #8f9bff; background: #2f3350; }
    .acc-surface { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .acc-morae { display: flex; gap: 1px; height: 36px; }
    .acc-mora { width: 24px; height: 18px; padding: 0; border: none; border-radius: 3px; background: #3a3f5c; color: var(--fg); font: inherit; font-size: 11px; cursor: pointer; }
    .acc-mora.h { align-self: flex-start; background: #5663c6; }
    .acc-mora.l { align-self: flex-end; }
    .acc-sep { flex: 0 0 auto; align-self: center; padding: 0 2px; font-size: 12px; color: var(--muted); }
    .acc-q { color: #8f9bff; font-weight: bold; }
    .acc-x { margin-left: 2px; padding: 0 2px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="tabs">
      <button type="button" class="tab active" data-tab="cue">Cue</button>
      <button type="button" class="tab" data-tab="idling">アイドリング</button>
      <button type="button" class="tab" data-tab="event">イベント</button>
      <button type="button" class="tab" data-tab="fidget">つつき</button>
    </nav>

    <div id="main">
      <div id="left">
        <div id="list-pane" class="left-pane">
          <div id="cue-list-section">
            <h2>Cue一覧</h2>
            <div id="cue-list" class="item-list"></div>
            <label class="filter"><input type="checkbox" id="show-internal" /> 内部Cueも表示</label>
          </div>
          <div id="seq-list-section" hidden>
            <h2>セリフ一覧</h2>
            <div id="seq-list" class="item-list"></div>
          </div>
        </div>
        <div id="tree-pane" class="left-pane">
          <h2>レイヤー（ポーズ・表情）</h2>
          <div id="tree"></div>
        </div>
      </div>

      <div id="center">
        <div id="preview-wrap"><canvas id="canvas"></canvas></div>
        <div id="steps-strip" hidden>
          <div id="steps-list"></div>
          <div class="strip-actions">
            <button type="button" class="action" id="step-add">＋ ステップを足す</button>
            <button type="button" class="action" id="seq-play-all">▶ 全部再生</button>
          </div>
          <div id="acc-lane">
            <div class="acc-head">
              <span>ACC（アクセント）</span>
              <span>エンジンが間違えている語だけを直す。強調には使わない（強調は **太字**）</span>
              <button type="button" class="action" id="acc-refresh">解析し直す</button>
            </div>
            <div id="acc-words"></div>
          </div>
        </div>
      </div>

      <div id="right" class="col">
        <div id="cue-form">
          <div class="field">
            <label for="cue-name">Cue名 / ファイル名（構造的・ソート可能）</label>
            <input type="text" id="cue-name" placeholder="例: emo_joy_hi" />
          </div>
          <div class="field">
            <label for="label">論理名 label（読みやすい呼び名）</label>
            <input type="text" id="label" placeholder="例: 大喜び" />
          </div>
          <div class="field">
            <label for="description">description</label>
            <input type="text" id="description" placeholder="どんな場面・気持ちのCueか" />
          </div>
          <div class="field check"><input type="checkbox" id="blink" /> <label for="blink">まばたき (blink)</label></div>
          <div class="field check"><input type="checkbox" id="internal" /> <label for="internal">内部Cue (internal)</label></div>

          <hr />
          <h2>声色 (voice)</h2>
          <div id="voice-styles"></div>
          <div class="field" style="margin-top:8px">
            <label for="test-text">試し喋り</label>
            <input type="text" id="test-text" placeholder="喋らせるセリフを入力" />
          </div>
          <button type="button" class="action" id="test-speak">🔊 試し喋り</button>

          <hr />
          <div class="row">
            <button type="button" class="action" id="new">新規</button>
            <button type="button" class="action" id="duplicate">複製</button>
            <button type="button" class="action" id="delete" disabled>削除</button>
            <button type="button" class="action" id="save">保存</button>
          </div>
        </div>

        <div id="seq-form" hidden>
          <div id="seq-empty" class="muted">左の一覧から選ぶか、「新規」で作ります。</div>
          <div id="seq-editor" hidden>
            <div class="grid2">
              <div class="field">
                <label for="seq-dir">置き場所</label>
                <select id="seq-dir"></select>
              </div>
              <div class="field">
                <label for="seq-name">名前（ファイル名）</label>
                <input type="text" id="seq-name" placeholder="例: umbrella" />
              </div>
            </div>
            <div id="seq-origin" class="muted"></div>
            <div id="seq-event-settings" class="muted"></div>
            <div class="grid2" style="margin-top:8px">
              <div class="field"><label for="seq-weight">出やすさ weight</label><input type="number" id="seq-weight" min="0" step="0.5" placeholder="1" /></div>
              <div class="field"><label for="seq-hour-from">時間帯（時〜時）</label>
                <div class="row"><input type="number" id="seq-hour-from" min="0" max="23" /><input type="number" id="seq-hour-to" min="0" max="23" /></div>
              </div>
              <div class="field"><label for="seq-min">好感度 以上</label><input type="number" id="seq-min" /></div>
              <div class="field"><label for="seq-max">好感度 以下</label><input type="number" id="seq-max" /></div>
            </div>

            <hr />
            <h2 id="step-title">ステップ</h2>
            <div class="field check"><input type="checkbox" id="step-inherit" /> <label for="step-inherit">直前のステップの見た目と声を引き継ぐ</label></div>
            <div class="field"><label for="step-text">セリフ（text）</label><input type="text" id="step-text" placeholder="無言のステップなら空" /></div>
            <div class="field"><label for="step-reading">読み（reading・ひらがな）</label><input type="text" id="step-reading" /></div>
            <div class="grid2">
              <div class="field"><label for="step-hold">無言の長さ ms</label><input type="number" id="step-hold" min="0" step="100" placeholder="2000" /></div>
              <div class="field check" style="margin-top:18px"><input type="checkbox" id="step-blink" /> <label for="step-blink">まばたき</label></div>
            </div>
            <h2>声色 (voice)</h2>
            <div id="seq-voice-styles"></div>
            <h2 style="margin-top:12px">演技 delivery（この行だけ）</h2>
            <div class="muted" style="margin-bottom:6px">チェックを入れた項目だけを上書きして保存します。◆ は声色から導いた自動の値。</div>
            <div id="delivery-panel"></div>
            <div class="field">
              <label for="dl-ending">語尾</label>
              <select id="dl-ending">
                <option value="">自動（表記どおり）</option>
                <option value="flat">平坦（？があっても上げない）</option>
                <option value="rise">上げる（？が無くても）</option>
              </select>
            </div>
            <details class="field">
              <summary>読み・アクセントの上書き words（JSON）</summary>
              <textarea id="dl-words" rows="3" placeholder='[{"word": "な", "pronunciation": "ナー", "hl": "lh"}]'></textarea>
            </details>
            <div class="row">
              <button type="button" class="action" id="step-play">▶ このステップ</button>
              <button type="button" class="action" id="step-up" title="前へ">↑</button>
              <button type="button" class="action" id="step-down" title="後ろへ">↓</button>
              <button type="button" class="action" id="step-remove">ステップ削除</button>
            </div>
          </div>

          <hr />
          <div class="row">
            <button type="button" class="action" id="seq-new">新規</button>
            <button type="button" class="action" id="seq-duplicate">複製</button>
            <button type="button" class="action" id="seq-delete" disabled>削除</button>
            <button type="button" class="action" id="seq-save">保存</button>
          </div>
        </div>

        <div id="status"></div>
      </div>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
