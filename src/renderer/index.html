<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:" />
  <title>ui-chan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #bubble-area {
      flex: 0 0 auto;
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 8px 10px 0;
      box-sizing: border-box;
      /* キャラクターの頭上（PSDの傘用余白ぶん）まで吹き出しを下げる */
      transform: translateY(46px);
      z-index: 1;
      position: relative;
    }
    #bubble {
      position: relative;
      max-width: 100%;
      /* 背景は髪の実ピクセル色 rgb(243,235,233)〜rgb(224,209,212)（淡い銀グレー）、
         枠・矢印・影はリボン/靴下の実ピクセル色 rgb(78,91,181) = #4e5bb5 */
      background: linear-gradient(180deg, rgba(250, 245, 243, 0.97), rgba(228, 216, 219, 0.97));
      border: 2px solid #4e5bb5;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #2e2a35;
      box-shadow: 0 3px 10px rgba(78, 91, 181, 0.28);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      word-break: break-word;
      /* 文ごとの改行（bubbleText）と、明示的な \n を効かせる */
      white-space: pre-wrap;
    }
    #bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      margin-left: -7px;
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: #4e5bb5 transparent transparent;
    }
    #canvas-wrap {
      flex: 1 1 auto;
      position: relative;
      /* No -webkit-app-region: drag — it swallows the mouse events the fidget
         needs (and triggers macOS double-click-to-reposition). Window dragging
         is done manually in renderer.ts (grab her body to move her). */
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #placeholder {
      display: none;
      position: absolute;
      inset: 12px;
      background: rgba(30, 34, 52, 0.92);
      border: 2px dashed #7a8ac0;
      border-radius: 16px;
      color: #e8ecff;
      padding: 20px;
      font-size: 13px;
      line-height: 1.8;
    }
    #placeholder h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    #placeholder code {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
    }
    /* ---- 接続パネル -------------------------------------------------
       世界観を壊さないための約束：平常時はリボン色の小さなつまみだけ。
       クリックで開き、複数セッションを検知したときだけ自分から開いて、
       用が済んだら畳まる。立ち絵と吹き出しには一切干渉しない。 */
    #panel {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 12px;
      color: #2e2a35;
    }
    #panel-tab {
      -webkit-app-region: no-drag;
      appearance: none;
      border: none;
      cursor: pointer;
      width: 26px;
      height: 14px;
      padding: 0;
      border-radius: 7px;
      background: rgba(78, 91, 181, 0.28);
      box-shadow: 0 1px 3px rgba(78, 91, 181, 0.25);
      opacity: 0.35;
      transition: opacity 0.2s ease, background 0.2s ease, width 0.2s ease;
      color: #fff;
      font: inherit;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
    }
    #panel:hover #panel-tab,
    #panel.open #panel-tab {
      opacity: 1;
      background: rgba(78, 91, 181, 0.92);
    }
    /* Collapsed with 0–1 sessions: a hamburger, drawn in CSS so it stays crisp
       and needs no font. With 2+ sessions the count replaces it. */
    #panel-tab::before {
      content: '';
      display: block;
      width: 12px;
      height: 8px;
      margin: 0 auto;
      border-top: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      box-sizing: border-box;
      background:
        linear-gradient(currentColor, currentColor) center / 12px 1.5px no-repeat;
    }
    #panel.crowded #panel-tab::before {
      display: none;
    }
    #panel.crowded #panel-tab {
      width: 30px;
    }
    #panel-body {
      margin-top: 6px;
      /* Narrow on purpose: open, it must not sit on top of her face. */
      width: 176px;
      background: linear-gradient(180deg, rgba(250, 245, 243, 0.98), rgba(232, 223, 226, 0.98));
      border: 1.5px solid #4e5bb5;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(78, 91, 181, 0.3);
      padding: 8px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #panel.open #panel-body {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .panel-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 4px;
      border-radius: 7px;
    }
    .panel-row.active {
      background: rgba(78, 91, 181, 0.14);
    }
    .panel-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(78, 91, 181, 0.28);
      flex: 0 0 auto;
    }
    .panel-row.active .panel-dot {
      background: #4e5bb5;
      box-shadow: 0 0 0 3px rgba(78, 91, 181, 0.18);
    }
    .panel-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
      overflow: hidden;
    }
    .panel-text b {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-text small {
      color: #6b6577;
      font-size: 10.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-empty {
      color: #6b6577;
      padding: 4px;
      text-align: center;
    }
    .panel-face {
      display: block;
      white-space: nowrap;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    /* 操作はアイコン1行。文字を置かないぶん「アプリのUI」に見えにくく、
       高さも固定なので、接続が増えて縦に伸びる見え方を邪魔しない。 */
    #panel-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      border-top: 1px solid rgba(78, 91, 181, 0.2);
      padding-top: 6px;
    }
    #panel-actions button {
      appearance: none;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 8px;
      /* 当たり判定を全部そろえる。図形の大小で押しやすさが変わらないように */
      width: 30px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4560;
    }
    #panel-actions button:hover {
      background: rgba(78, 91, 181, 0.14);
      color: #4e5bb5;
    }
    #panel-actions svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* ミュート中は「音が消えている」形（波→斜線）に変わり、色でも分かる。
       詳細度が上がる順に並べる（下がる順だと、あとの規則が効かない事故を招く）。 */
    #panel-actions .i-slash {
      display: none;
    }
    #panel-actions button.on {
      color: #4e5bb5;
      background: rgba(78, 91, 181, 0.16);
    }
    #panel-actions button.on .i-wave {
      display: none;
    }
    #panel-actions button.on .i-slash {
      display: inline;
    }
    #panel-gear.on svg path {
      fill: currentColor;
    }
    /* 終了だけは押し間違えると困るので、触れたときだけ赤くして手を止めさせる。 */
    #panel-actions button[data-action='quit'] {
      color: #8a8497;
    }
    #panel-actions button[data-action='quit']:hover {
      color: #b4515e;
      background: rgba(180, 81, 94, 0.12);
    }
    /* 更新は「あるときだけ」出す。常設すると平常時の情報がひとつ増える。 */
    #panel-update[hidden] {
      display: none;
    }
    #panel-update {
      color: #4e5bb5;
    }
    /* 好感度スライダー。歯車で開くまで存在しない（普段のパネルは「誰がいるか」
       だけを答える場所で、設定はそのついでに触れればいい）。 */
    #panel-affinity {
      margin-top: 6px;
      border-top: 1px solid rgba(78, 91, 181, 0.2);
      padding: 6px 4px 2px;
    }
    #panel-affinity[hidden] {
      display: none;
    }
    .aff-head {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: #6b6577;
      font-size: 11px;
    }
    .aff-head b {
      color: #2e2a35;
      font-size: 13px;
      margin-left: auto;
    }
    .aff-head small {
      font-size: 10.5px;
      color: #4e5bb5;
    }
    #aff-range {
      width: 100%;
      margin: 4px 0 0;
      accent-color: #4e5bb5;
    }
    /* 更新の入口は「あるときだけ」出す。常設すると平常時の情報がひとつ増える。 */
    #panel-update[hidden] {
      display: none;
    }
    #panel-update {
      color: #4e5bb5;
      margin-left: auto;
    }
    #panel-update + button[data-action='quit'] {
      margin-left: 4px;
    }
    /* 終了だけは押し間違えると困るので、右端に離して置く。 */
    #panel-actions button[data-action='quit'] {
      margin-left: auto;
      color: #8a8497;
    }
    #panel-actions button[data-action='quit']:hover {
      color: #b4515e;
      background: rgba(180, 81, 94, 0.12);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="panel">
      <button id="panel-tab" type="button" title="接続中のセッション"><span id="panel-count"></span></button>
      <div id="panel-body">
        <div id="panel-list"></div>
        <div id="panel-affinity" hidden>
          <div class="aff-head"><span>好感度</span><b id="aff-value">–</b><small id="aff-band"></small></div>
          <input id="aff-range" type="range" min="0" max="100" step="1" value="0" />
        </div>
        <div id="panel-actions">
          <!-- 並びは左から「よく押す → 設定 → 起き直す → 終了」。手が滑って隣を
               押しても軽い操作にしか当たらないよう、終了は必ず右端。
               「定位置に戻す」は独立したボタンにしない——再起動すれば位置は戻るし、
               好感度は持ち越すので、再起動に副作用が無いから。
               説明はブラウザ標準のツールチップ（title）に任せる。 -->
          <button type="button" data-action="mute" title="声だけ止める" aria-label="声だけ止める">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4.4 8h2.8L11 4.8v10.4L7.2 12H4.4z" />
              <path class="i-wave" d="M13.6 7.4a3.4 3.4 0 0 1 0 5.2" />
              <path class="i-slash" d="M13.4 7.6l4 4.8M17.4 7.6l-4 4.8" />
            </svg>
          </button>
          <button type="button" data-action="clear" title="いま喋っているのを止める" aria-label="喋るのをやめる">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="6.2" />
              <path d="M5.6 14.4L14.4 5.6" />
            </svg>
          </button>
          <button type="button" id="panel-gear" title="好感度" aria-label="好感度">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 15.8S3.8 12.2 3.8 8.1a3.3 3.3 0 0 1 6.2-1.5 3.3 3.3 0 0 1 6.2 1.5c0 4.1-6.2 7.7-6.2 7.7z" />
            </svg>
          </button>
          <button type="button" data-action="restart" title="起動しなおす（定位置に戻る）" aria-label="起動しなおす">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M16 7.6A6.4 6.4 0 1 0 16.3 12" />
              <path d="M16.6 3.6v4.2h-4.2" />
            </svg>
          </button>
          <button type="button" data-action="update" id="panel-update" title="更新があります" aria-label="更新する" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 4v7.6" />
              <path d="M6.8 8.6L10 11.8l3.2-3.2" />
              <path d="M4.6 14v1.2a1 1 0 0 0 1 1h8.8a1 1 0 0 0 1-1V14" />
            </svg>
          </button>
          <button type="button" data-action="quit" title="終了する（呼ばれても起きない）" aria-label="終了">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 4v6" />
              <path d="M6.4 6.2a5.6 5.6 0 1 0 7.2 0" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="bubble-area"><div id="bubble"></div></div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="placeholder">
        <h1>ui-chan: 素材が見つかりません</h1>
        <p>
          立ち絵のPSDファイルを <code id="assets-dir">ui_sozai/</code> ディレクトリに
          配置して、アプリを再起動してください。
        </p>
        <p>
          PSDTool形式（<code>!</code>=必須レイヤー、<code>*</code>=ラジオ切替）の
          PSDに対応しています。レイヤー名と表情のマッピングは
          <code>ui-chan.config.json</code> で設定できます。
        </p>
      </div>
    </div>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
