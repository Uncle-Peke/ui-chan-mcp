<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:" />
  <title>ui-chan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #bubble-area {
      flex: 0 0 auto;
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 8px 10px 0;
      box-sizing: border-box;
      /* キャラクターの頭上（PSDの傘用余白ぶん）まで吹き出しを下げる */
      transform: translateY(46px);
      z-index: 1;
      position: relative;
    }
    #bubble {
      position: relative;
      max-width: 100%;
      /* 背景は髪の実ピクセル色 rgb(243,235,233)〜rgb(224,209,212)（淡い銀グレー）、
         枠・矢印・影はリボン/靴下の実ピクセル色 rgb(78,91,181) = #4e5bb5 */
      background: linear-gradient(180deg, rgba(250, 245, 243, 0.97), rgba(228, 216, 219, 0.97));
      border: 2px solid #4e5bb5;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #2e2a35;
      box-shadow: 0 3px 10px rgba(78, 91, 181, 0.28);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      word-break: break-word;
      /* 文ごとの改行（bubbleText）と、明示的な \n を効かせる */
      white-space: pre-wrap;
    }
    #bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      margin-left: -7px;
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: #4e5bb5 transparent transparent;
    }
    #canvas-wrap {
      flex: 1 1 auto;
      position: relative;
      /* No -webkit-app-region: drag — it swallows the mouse events the fidget
         needs (and triggers macOS double-click-to-reposition). Window dragging
         is done manually in renderer.ts (grab her body to move her). */
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #placeholder {
      display: none;
      position: absolute;
      inset: 12px;
      background: rgba(30, 34, 52, 0.92);
      border: 2px dashed #7a8ac0;
      border-radius: 16px;
      color: #e8ecff;
      padding: 20px;
      font-size: 13px;
      line-height: 1.8;
    }
    #placeholder h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    #placeholder code {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
    }
    /* ---- 接続パネル -------------------------------------------------
       世界観を壊さないための約束：平常時はリボン色の小さなつまみだけ。
       クリックで開き、複数セッションを検知したときだけ自分から開いて、
       用が済んだら畳まる。立ち絵と吹き出しには一切干渉しない。 */
    #panel {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 12px;
      color: #2e2a35;
    }
    #panel-tab {
      -webkit-app-region: no-drag;
      appearance: none;
      border: none;
      cursor: pointer;
      width: 26px;
      height: 14px;
      padding: 0;
      border-radius: 7px;
      background: rgba(78, 91, 181, 0.28);
      box-shadow: 0 1px 3px rgba(78, 91, 181, 0.25);
      opacity: 0.35;
      transition: opacity 0.2s ease, background 0.2s ease, width 0.2s ease;
      color: #fff;
      font: inherit;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
    }
    #panel:hover #panel-tab,
    #panel.open #panel-tab {
      opacity: 1;
      background: rgba(78, 91, 181, 0.92);
    }
    /* Collapsed with 0–1 sessions: a hamburger, drawn in CSS so it stays crisp
       and needs no font. With 2+ sessions the count replaces it. */
    #panel-tab::before {
      content: '';
      display: block;
      width: 12px;
      height: 8px;
      margin: 0 auto;
      border-top: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      box-sizing: border-box;
      background:
        linear-gradient(currentColor, currentColor) center / 12px 1.5px no-repeat;
    }
    #panel.crowded #panel-tab::before {
      display: none;
    }
    #panel.crowded #panel-tab {
      width: 30px;
    }
    #panel-body {
      margin-top: 6px;
      /* Narrow on purpose: open, it must not sit on top of her face. */
      width: 176px;
      background: linear-gradient(180deg, rgba(250, 245, 243, 0.98), rgba(232, 223, 226, 0.98));
      border: 1.5px solid #4e5bb5;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(78, 91, 181, 0.3);
      padding: 8px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #panel.open #panel-body {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .panel-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 4px;
      border-radius: 7px;
    }
    .panel-row.active {
      background: rgba(78, 91, 181, 0.14);
    }
    .panel-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(78, 91, 181, 0.28);
      flex: 0 0 auto;
    }
    .panel-row.active .panel-dot {
      background: #4e5bb5;
      box-shadow: 0 0 0 3px rgba(78, 91, 181, 0.18);
    }
    .panel-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
      overflow: hidden;
    }
    .panel-text b {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-text small {
      color: #6b6577;
      font-size: 10.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-empty {
      color: #6b6577;
      padding: 4px;
    }
    #panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      border-top: 1px solid rgba(78, 91, 181, 0.2);
      padding-top: 8px;
    }
    #panel-actions button {
      appearance: none;
      cursor: pointer;
      font: inherit;
      font-size: 10.5px;
      color: #3a3550;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(78, 91, 181, 0.35);
      border-radius: 7px;
      padding: 3px 8px;
    }
    #panel-actions button:hover {
      background: #fff;
      border-color: #4e5bb5;
    }
    #panel-actions button.on {
      background: rgba(78, 91, 181, 0.9);
      border-color: #4e5bb5;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="panel">
      <button id="panel-tab" type="button" title="接続中のセッション"><span id="panel-count"></span></button>
      <div id="panel-body">
        <div id="panel-list"></div>
        <div id="panel-actions">
          <button type="button" data-action="mute">しずかに</button>
          <button type="button" data-action="clear">ひっこめる</button>
          <button type="button" data-action="restart">再起動</button>
          <button type="button" data-action="quit">おやすみ</button>
        </div>
      </div>
    </div>
    <div id="bubble-area"><div id="bubble"></div></div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="placeholder">
        <h1>ui-chan: 素材が見つかりません</h1>
        <p>
          立ち絵のPSDファイルを <code id="assets-dir">ui_sozai/</code> ディレクトリに
          配置して、アプリを再起動してください。
        </p>
        <p>
          PSDTool形式（<code>!</code>=必須レイヤー、<code>*</code>=ラジオ切替）の
          PSDに対応しています。レイヤー名と表情のマッピングは
          <code>ui-chan.config.json</code> で設定できます。
        </p>
      </div>
    </div>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
