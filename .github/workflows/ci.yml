# 壊れたまま main に入るのを止めるための最低限。
#
# ここで走るものは、すべてローカルでも同じコマンドで再現できる（npm scripts か
# tools/ の1ファイル）。CI にしか無い手順を作らないのは、落ちたときに手元で
# 追えなくなるのを避けるため。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Electron のバイナリ（200MB超）は CI では要らない。アプリを起動する
      # テストは無く、tsc も esbuild も型と JS しか見ないため。
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` は prepare を走らせるので、これ自体がビルドの検証になる。
      - run: npm ci
      - name: 型チェック
        run: npx tsc -p tsconfig.json --noEmit
      - name: Lint / format
        run: npx biome check .
      - name: Cue のスキーマ検証
        run: npm run validate-cues
      - name: 配布物の検査（ライセンス素材・秘密情報の混入）
        run: npm run check-package
