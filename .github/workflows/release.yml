# npm への公開。CI と分けてあるのは、公開が「起きてしまう」ものであっては
# ならないから：タグを打つか、手で起動するかしないと走らない。
#
# 公開物は **この場でビルドしたもの** に限る。手元から `npm publish` すると
# 「そのとき手元にあった dist/」が世界に出るが、ここではクリーンな環境で
# npm ci → build → 検査 → publish の順に必ず通る。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '公開せず、作られる tarball の中身だけ確認する'
        type: boolean
        default: true

jobs:
  publish:
    # macos-latest である必要がある：package.json の os が darwin 限定なので、
    # Linux ランナーでは npm ci が EBADPLATFORM で落ちる。ui-chan が macOS 専用で
    # ある以上、検証も公開も macOS でやるのが筋でもある。
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) は npm 11.5.1 以降。setup-node が入れる npm が
      # それより古い環境で落ちないよう、明示的に上げる。
      - run: npm install -g npm@latest
      - run: npm ci
      - name: 型チェック
        run: npx tsc -p tsconfig.json --noEmit
      - name: Cue のスキーマ検証
        run: npm run validate-cues
      - name: 配布物の検査
        run: npm run check-package
      - name: 中身の確認
        run: npm pack --dry-run
      # ここまで（型・Cue・配布物検査）が全部通ったものだけが世界に出る。
      #
      # 認証は npm の Trusted Publishing（OIDC）。npm 側にこのリポジトリと
      # release.yml が登録してあり、GitHub が発行する id-token をそのまま
      # 身元証明に使う。**トークンは存在しない** ——盗まれるものが無いし、
      # 期限切れで publish が止まることもない。
      # （必要な権限は job の permissions: id-token: write）
      - name: 公開
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
